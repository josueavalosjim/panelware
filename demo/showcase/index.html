<!--
  FIVE 16:9 COMPOSITIONS, FOR POSTING.

  No JavaScript renders a component on this page. The skins, axes, and icons
  comps are the kit's own markup, the same way demo/states.html is, so a
  screenshot of them is a screenshot of what the CSS does. The hero and the
  player are other pages in frames, because their sliders need Radix and
  static markup cannot show a slider. The script at the bottom only switches
  which comp is visible and scales the stage.

  The stage is exactly 1920x1080 and scales to fit, so what is on screen and
  what gets captured are the same composition at two sizes. scripts/shoot.mjs
  drives this page and writes the PNGs.
-->

          <div class="sheet" data-skin-scope><span class="pw-icon" aria-hidden="true" data-icon="play"></span><span class="pw-icon" aria-hidden="true" data-icon="pause"></span><span class="pw-icon" aria-hidden="true" data-icon="stop"></span><span class="pw-icon" aria-hidden="true" data-icon="previous"></span><span class="pw-icon" aria-hidden="true" data-icon="next"></span><span class="pw-icon" aria-hidden="true" data-icon="eject"></span><span class="pw-icon" aria-hidden="true" data-icon="close"></span><span class="pw-icon" aria-hidden="true" data-icon="minimize"></span><span class="pw-icon" aria-hidden="true" data-icon="maximize"></span><span class="pw-icon" aria-hidden="true" data-icon="restore"></span><span class="pw-icon" aria-hidden="true" data-icon="chevron-down"></span><span class="pw-icon" aria-hidden="true" data-icon="chevron-up"></span><span class="pw-icon" aria-hidden="true" data-icon="chevron-right"></span><span class="pw-icon" aria-hidden="true" data-icon="chevron-left"></span><span class="pw-icon" aria-hidden="true" data-icon="check"></span><span class="pw-icon" aria-hidden="true" data-icon="exclamation"></span><span class="pw-icon" aria-hidden="true" data-icon="dot"></span><span class="pw-icon" aria-hidden="true" data-icon="minus"></span><span class="pw-icon" aria-hidden="true" data-icon="plus"></span><span class="pw-icon" aria-hidden="true" data-icon="caret-down"></span><span class="pw-icon" aria-hidden="true" data-icon="search"></span><span class="pw-icon" aria-hidden="true" data-icon="info"></span><span class="pw-icon" aria-hidden="true" data-icon="question"></span><span class="pw-icon" aria-hidden="true" data-icon="ellipsis"></span></div>
          <figcaption class="comp-caption">cyber</figcaption>
        </figure>
        <figure data-skin="paper">
          <div class="sheet" data-skin-scope><span class="pw-icon" aria-hidden="true" data-icon="play"></span><span class="pw-icon" aria-hidden="true" data-icon="pause"></span><span class="pw-icon" aria-hidden="true" data-icon="stop"></span><span class="pw-icon" aria-hidden="true" data-icon="previous"></span><span class="pw-icon" aria-hidden="true" data-icon="next"></span><span class="pw-icon" aria-hidden="true" data-icon="eject"></span><span class="pw-icon" aria-hidden="true" data-icon="close"></span><span class="pw-icon" aria-hidden="true" data-icon="minimize"></span><span class="pw-icon" aria-hidden="true" data-icon="maximize"></span><span class="pw-icon" aria-hidden="true" data-icon="restore"></span><span class="pw-icon" aria-hidden="true" data-icon="chevron-down"></span><span class="pw-icon" aria-hidden="true" data-icon="chevron-up"></span><span class="pw-icon" aria-hidden="true" data-icon="chevron-right"></span><span class="pw-icon" aria-hidden="true" data-icon="chevron-left"></span><span class="pw-icon" aria-hidden="true" data-icon="check"></span><span class="pw-icon" aria-hidden="true" data-icon="exclamation"></span><span class="pw-icon" aria-hidden="true" data-icon="dot"></span><span class="pw-icon" aria-hidden="true" data-icon="minus"></span><span class="pw-icon" aria-hidden="true" data-icon="plus"></span><span class="pw-icon" aria-hidden="true" data-icon="caret-down"></span><span class="pw-icon" aria-hidden="true" data-icon="search"></span><span class="pw-icon" aria-hidden="true" data-icon="info"></span><span class="pw-icon" aria-hidden="true" data-icon="question"></span><span class="pw-icon" aria-hidden="true" data-icon="ellipsis"></span></div>

      </div>

      <div class="comp comp-player" data-comp="player">
        <iframe id="player-frame" src="../player/index.html?bare=1&amp;skin=chrome&amp;theme=light&amp;layout=columns&amp;lock" title="panelware player"></iframe>
      </div>

    </div>
  </div>

  <div class="rig">
    <label>comp <select id="pick-comp">
      <option value="hero">hero</option>
      <option value="skins">skins</option>
      <option value="axes">axes</option>
      <option value="icons">icons</option>
      <option value="player">player</option>
    </select></label>
    <label>skin <select id="pick-skin">
      <option value="chrome">chrome</option>
      <option value="cyber">cyber</option>
      <option value="paper">paper</option>
      <option value="dialup">dialup</option>
    </select></label>
    <button type="button" id="pick-theme">dark</button>
  </div>

  <script type="module">
    const stage = document.getElementById('stage');
    const frame = document.querySelector('.frame');
    const root = document.documentElement;

    /* The stage is a fixed 1920x1080 and this is the only thing that makes it
       fit. Measured from the frame rather than the viewport, so the page works
       inside an iframe and inside the capture script's 1920 wide window, where
       the scale lands on exactly 1. */
    const fit = () => {
      const r = frame.getBoundingClientRect();
      stage.style.setProperty('--fit', String(r.width / 1920));
    };
    fit();
    new ResizeObserver(fit).observe(frame);

    const show = (name) => {
      for (const el of document.querySelectorAll('.comp')) {
        if (el.dataset.comp === name) el.setAttribute('data-on', '');
        else el.removeAttribute('data-on');
      }
    };

    document.getElementById('pick-comp').addEventListener('change', (e) => show(e.target.value));
    document.getElementById('pick-skin').addEventListener('change', (e) => {
      root.dataset.skin = e.target.value;
    });
    document.getElementById('pick-theme').addEventListener('click', (e) => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      e.target.textContent = next === 'dark' ? 'light' : 'dark';
    });

    const look = { skin: 'chrome', theme: 'light' };
    const reframe = (next) => {
      Object.assign(look, next);
      const frame = document.getElementById('player-frame');
      frame.src = `../player/index.html?bare=1&skin=${look.skin}&theme=${look.theme}&layout=columns&lock`;
    };
    document.getElementById('pick-skin').addEventListener('change', (e) => reframe({ skin: e.target.value }));
    document.getElementById('pick-theme').addEventListener('click', () => {
      reframe({ theme: root.dataset.theme === 'dark' ? 'dark' : 'light' });
    });

    /* scripts/shoot.mjs calls these. */
    window.showcase = {
      show,
      /* The player is in an iframe, so it is reloaded with the look rather
         than inheriting it. Everything else on the page reads the attributes
         on <html> directly. */
      skin: (v) => { root.dataset.skin = v; reframe({ skin: v }); },
      theme: (v) => { root.dataset.theme = v; reframe({ theme: v }); },
      capture: (on) => {
        if (on) document.body.setAttribute('data-capture', '');
        else document.body.removeAttribute('data-capture');
      },
    };
  </script>
</body>
</html>
