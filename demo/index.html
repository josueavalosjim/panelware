<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panelware</title>
<!--
  The live page. Real React, real Radix, real interaction, and still no build
  step: an import map points the bare specifiers at a CDN and panelware itself
  comes from the compiled ../dist. The compiler output runs unmodified in the
  browser because it is plain ESM.

  states.html is the other half of this pair and is not redundant with it. It
  has no JavaScript at all, which is what makes it the proof that the CSS
  works without React, the target the contrast gate measures, and the place
  every attribute-driven state can be seen at once. This page is where the
  things only a running component can show live: the dialog's focus trap, the
  slider's arrow keys, the marquee's pause control.
-->
<link rel="stylesheet" href="../css/panelware.css">
<link rel="stylesheet" href="./demo.css">
<link rel="stylesheet" href="./docs.css">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.8",
    "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.2.8",
    "react-dom/client": "https://esm.sh/react-dom@19.2.8/client",
    "radix-ui": "https://esm.sh/radix-ui@1.6.7?external=react,react-dom"
  }
}
</script>
</head>
<body>
  <header class="demo-header">
    <h1 class="demo-title">panelware</h1>
    <p class="demo-note">
      The live components. Tab through them, press Escape in the dialog, drag
      a slider with the arrow keys, stop the marquee with its own button.
      <a class="demo-link" href="./states.html">Every state, without JavaScript</a>.
    </p>
  </header>
  <main class="demo-main" id="root"></main>

  <script type="module">
    import { createElement as h, useEffect, useState, StrictMode } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Badge, Spinner, Button, Dialog, DialogPanel, DialogTrigger, Equalizer, Icon,
      List, Menu, MenuCheckboxItem, MenuContent, MenuItem, MenuLabel, MenuRadioGroup,
      MenuRadioItem, MenuSeparator, MenuSub, MenuTrigger, Menubar,
      Progress, Readout, Slider, Tab, TabList, TabPanel, Tabs, Toggle,
      Checkbox, Field, Radio, RadioGroup, Select, SelectItem,
      ToggleGroup, ToggleGroupItem, Transport, TransportButton, Window,
    } from '../dist/index.js';

    /* `note` may be a string or a map keyed by skin. Most notes describe
       behaviour and read the same under any skin; a few describe the
       treatment, and those were describing chrome's while the cyber skin was
       on screen. "The bevel flips and the face drops a pixel" above a control
       with no bevel is a docs page arguing with itself. */
    const Section = ({ id, title, note, code, children, skin }) =>
      h('section', { className: 'demo-section', id },
        h('h2', { className: 'demo-heading' }, title),
        h('p', { className: 'demo-note' },
          typeof note === 'string' ? note : (note[skin] ?? note.chrome)),
        h('div', { className: 'demo-row' }, children),
        code ? h(Code, null, code) : null);

    /* The three axes, driven by the kit's own components. A theme switcher
       built out of something else would be a design system whose docs do not
       use it. */
    function Axis({ label, value, options, onChange }) {
      /* A ToggleGroup, not Tabs. This was Tabs first, which meant a tablist
         whose triggers carried aria-controls pointing at no tabpanel: an
         orphaned pattern, and one this kit's own audit had already flagged
         elsewhere. Tabs show one of several panels; a segmented control
         chooses one of several values. */
      return h('div', { className: 'demo-axis' },
        h('span', { className: 'demo-axis-label', id: 'axis-' + label }, label),
        h(ToggleGroup, {
          label, value,
          onValueChange: (v) => { if (v) onChange(v); },
        }, options.map((o) => h(ToggleGroupItem, { key: o, value: o }, o))));
    }

    function Code({ children }) {
      return h('details', { className: 'demo-code' },
        h('summary', null, 'code'),
        h('pre', { className: 'demo-pre' }, h('code', null, children)));
    }

    function TokenTable({ groups }) {
      return h('div', null, groups.map((g) =>
        h('div', { key: g.name },
          h('h3', { className: 'demo-heading' }, g.name),
          h('p', { className: 'demo-note demo-mono' }, g.file),
          h('div', { className: 'demo-table-wrap' },
            h('table', { className: 'demo-table' },
              h('thead', null, h('tr', null,
                h('th', null, 'Token'),
                ...Object.keys(g.tokens[0].values).map((v) => h('th', { key: v }, v)))),
              h('tbody', null, g.tokens.map((t) =>
                h('tr', { key: t.name },
                  h('td', { className: 'demo-mono' }, t.name),
                  ...Object.keys(g.tokens[0].values).map((v) => {
                    const cell = t.values[v];
                    if (!cell) return h('td', { key: v }, '');
                    const shown = cell.resolved ?? cell.declared;
                    const isColour = /^#|^rgb|^oklch/.test(shown);
                    return h('td', { key: v, className: 'demo-mono' },
                      isColour ? h('span', {
                        className: 'demo-swatch',
                        style: { background: shown },
                      }) : null,
                      shown);
                  })))))))));
    }

    function ContrastTable({ rows }) {
      const themes = [...new Set(rows.map((r) => r.theme))];
      return h('div', null, themes.map((theme) =>
        h('div', { key: theme },
          h('h3', { className: 'demo-heading' }, theme),
          h('div', { className: 'demo-table-wrap' },
            h('table', { className: 'demo-table' },
              h('thead', null, h('tr', null,
                h('th', null, 'Foreground'), h('th', null, 'Background'),
                h('th', null, 'What it is'),
                h('th', { className: 'demo-num' }, 'Measured'),
                h('th', { className: 'demo-num' }, 'Floor'))),
              h('tbody', null, rows.filter((r) => r.theme === theme).map((r, i) =>
                h('tr', { key: i },
                  h('td', { className: 'demo-mono' }, r.fg),
                  h('td', { className: 'demo-mono' }, r.bg),
                  h('td', null, r.note ?? ''),
                  h('td', { className: 'demo-num ' + (r.pass ? 'demo-pass' : 'demo-fail') },
                    r.ratio.toFixed(2) + ':1'),
                  h('td', { className: 'demo-num' }, r.min.toFixed(1))))))))));
    }

    function App() {
      const [shuffle, setShuffle] = useState(false);
      const [repeat, setRepeat] = useState(true);
      const [volume, setVolume] = useState([40]);
      const [playing, setPlaying] = useState(false);
      const [position, setPosition] = useState([28]);
      const [doubleSize, setDoubleSize] = useState(false);
      const [alwaysOnTop, setAlwaysOnTop] = useState(true);
      const [skin, setSkin] = useState('base');
      const [picked, setPicked] = useState('t3');
      const [density, setDensityAxis] = useState('comfortable');
      const [themeAxis, setThemeAxis] = useState('light');
      const [skinAxis, setSkinAxis] = useState('chrome');
      const [presetAxis, setPresetAxis] = useState('default');
      /* Presets are nested under a skin, so the list is per skin and the
         picker resets when the skin changes rather than leaving a value
         selected that no longer means anything. */
      const PRESETS = { chrome: ['default', 'deck'], cyber: ['default'] };
      const [docs, setDocs] = useState(null);

      /* The switcher writes the attributes a consumer would write. It is not
         a preview mode: the page is the kit, running under whatever the three
         axes say. */
      useEffect(() => {
        const el = document.documentElement;
        el.setAttribute('data-theme', themeAxis);
        el.setAttribute('data-density', density);
        el.setAttribute('data-skin', skinAxis);
        if (presetAxis === 'default') el.removeAttribute('data-preset');
        else el.setAttribute('data-preset', presetAxis);
      }, [themeAxis, density, skinAxis, presetAxis]);

      useEffect(() => { setPresetAxis('default'); }, [skinAxis]);

      useEffect(() => {
        fetch('./docs-data.json').then((r) => r.json()).then(setDocs).catch(() => {});
      }, []);
      const [nowPlaying, setNowPlaying] = useState('t1');
      const tracks = [
        ['t1', 'DJ Mike Llama - Llama Whippin Intro', '0:05'],
        ['t2', 'Mori Calliope - Go-Getters', '3:15'],
        ['t3', 'CircusP - Goodbye', '3:24'],
        ['t4', 'AmaLee - Siren', '4:02'],
        ['t5', 'Crusher-P - Echo', '3:50'],
        ['t6', 'M83 - Midnight City', '4:03'],
        ['t7', 'Sunnexo - Please Wait', '4:15'],
        ['t8', 'Omaru Polka - Persona', '4:56'],
      ].map(([id, primary, secondary]) => ({ id, primary, secondary }));
      const [eq, setEq] = useState(() => [
        ['60', '60 hertz', 4], ['170', '170 hertz', 2], ['310', '310 hertz', 0],
        ['600', '600 hertz', -2], ['1k', '1 kilohertz', -4], ['3k', '3 kilohertz', -1],
        ['6k', '6 kilohertz', 3], ['12k', '12 kilohertz', 6], ['14k', '14 kilohertz', 5],
        ['16k', '16 kilohertz', 2],
      ].map(([label, name, value]) => ({ id: label, label, name, value })));
      const [gain, setGain] = useState([70]);

      return h('div', null,
        h('div', { className: 'demo-bar' },
          h(Axis, { label: 'Theme', value: themeAxis, options: ['light', 'dark'], onChange: setThemeAxis }),
          h(Axis, { label: 'Density', value: density, options: ['comfortable', 'compact'], onChange: setDensityAxis }),
          /* Skin is a combo box rather than a segmented control, because it
             is the axis that grows: one today, two or three once a second
             skin lands. A segmented control at five values is a toolbar. */
          h('div', { className: 'demo-axis' },
            h('span', { className: 'demo-axis-label' }, 'Skin'),
            h(Select, { label: 'Skin', value: skinAxis, onValueChange: setSkinAxis },
              h(SelectItem, { value: 'chrome' }, 'Chrome'),
              h(SelectItem, { value: 'cyber' }, 'Cyber'))),
          /* Only rendered when the skin has more than one, because a picker
             with one option is a label wearing a control's clothes. */
          PRESETS[skinAxis].length > 1
            ? h('div', { className: 'demo-axis' },
                h('span', { className: 'demo-axis-label' }, 'Preset'),
                h(Select, { label: 'Preset', value: presetAxis, onValueChange: setPresetAxis },
                  ...PRESETS[skinAxis].map((v) =>
                    h(SelectItem, { value: v, key: v }, v === 'default' ? 'Default' : 'Deck'))))
            : null),

        h(Section, {
          skin: skinAxis,
          id: 'buttons', title: 'Button',
          note: {
            chrome: 'Press one. The bevel flips and the face drops a pixel; the gloss dims only on the control that sinks.',
            cyber: 'Press one. The face drops a pixel and the hairline stays put. There is no bevel to flip and no gloss to dim: this skin sets both knobs to zero and the treatment collapses without a component knowing.',
          },
          code: `import { Button } from '@josueavalosjim/panelware';

<Button>Open</Button>
<Button variant="primary">Save changes</Button>
<Button variant="primary" gloss>Glossed</Button>
<Button disabled>Unavailable</Button>

// asChild renders your element with the styling
<Button asChild><a href="/somewhere">As a link</a></Button>`,
        },
          h(Button, { onClick: () => {} }, 'Open'),
          h(Button, { variant: 'primary' }, 'Save changes'),
          /* Same two buttons, same gloss prop, relabelled per skin. Under
             cyber they are still marked [data-gloss] and the skin's opacity
             of 0 silences them, which is the whole reason gloss is a token
             and not a class: the markup stays honest and no consumer has to
             delete an attribute when they change skin. Calling them
             "Glossed" while they are not is the same lie the section note
             was telling one line above. */
          h(Button, { variant: 'primary', gloss: true },
            skinAxis === 'cyber' ? 'data-gloss, silenced' : 'Glossed'),
          h(Button, { gloss: true },
            skinAxis === 'cyber' ? 'data-gloss, on a face' : 'Gloss on silver'),
          h(Button, { disabled: true }, 'Unavailable'),
          h(Button, { asChild: true },
            h('a', { href: './states.html' }, 'asChild, as a link'))),

        h(Section, {
          skin: skinAxis,
          id: 'field', title: 'Form controls',
          note: 'The label is part of the target: clicking the words works, which is native behaviour a hand-rolled checkbox routinely loses. The radio is the one round thing in the kit, because the shape is what tells you it is a choose-one before you have read a word. The combo box is a sunken field with a raised drop button, which is what makes it read as something you can open.',
          code: `import { Field, Checkbox, RadioGroup, Radio, Select, SelectItem }
  from '@josueavalosjim/panelware';

<Field label="Always on top">
  <Checkbox checked={onTop} onCheckedChange={setOnTop} />
</Field>

// Indeterminate is a third state with its own mark, not a dimmer second one
<Field label="Some tracks"><Checkbox checked="indeterminate" /></Field>

<RadioGroup value={skin} onValueChange={setSkin}>
  <Field label="Base"><Radio value="base" /></Field>
  <Field label="Night"><Radio value="night" /></Field>
</RadioGroup>

<Select label="Output device" defaultValue="wave" placeholder="Choose one">
  <SelectItem value="wave">DirectSound</SelectItem>
  <SelectItem value="asio">ASIO</SelectItem>
</Select>`,
        },
          h('div', { className: 'demo-stack' },
            h(Field, { label: 'Always on top' },
              h(Checkbox, { checked: alwaysOnTop, onCheckedChange: setAlwaysOnTop })),
            h(Field, { label: 'Some tracks selected' },
              h(Checkbox, { checked: 'indeterminate' })),
            h(Field, { label: 'Unavailable' }, h(Checkbox, { disabled: true })),
            h(RadioGroup, {
              value: skin, onValueChange: setSkin,
              style: { display: 'flex', flexDirection: 'column' },
            },
              h(Field, { label: 'Base' }, h(Radio, { value: 'base' })),
              h(Field, { label: 'Night' }, h(Radio, { value: 'night' })),
              h(Field, { label: 'Unavailable' }, h(Radio, { value: 'x', disabled: true }))),
            h(Select, { label: 'Output device', defaultValue: 'wave' },
              h(SelectItem, { value: 'wave' }, 'DirectSound'),
              h(SelectItem, { value: 'asio' }, 'ASIO'),
              h(SelectItem, { value: 'null', disabled: true }, 'Null output')))),

        h(Section, {
          skin: skinAxis,
          id: 'toggle', title: 'Toggle',
          note: {
            chrome: 'On is sunken and heavier. Both the data state and the ARIA state change together, which is what the CSS keys off.',
            cyber: 'On is recessed and heavier. The inner shadow replaces the flipped bevel, so the state is still carried by depth and weight rather than by colour alone.',
          },
          code: `import { Toggle } from '@josueavalosjim/panelware';

const [on, setOn] = useState(false);

<Toggle pressed={on} onPressedChange={setOn}>Shuffle</Toggle>`,
        },
          h(Toggle, { pressed: repeat, onPressedChange: setRepeat }, 'Repeat'),
          h(Toggle, { pressed: shuffle, onPressedChange: setShuffle }, 'Shuffle'),
          h(Toggle, { disabled: true }, 'Crossfade')),

        h(Section, {
          skin: skinAxis,
          id: 'tabs', title: 'Tabs',
          note: 'Tab enters the strip once; the arrow keys move selection. Radix supplies the roving tabindex and both aria references.',
          code: `import { Tabs, TabList, Tab, TabPanel } from '@josueavalosjim/panelware';

<Tabs defaultValue="eq">
  <TabList>
    <Tab value="out">Output</Tab>
    <Tab value="eq">Equaliser</Tab>
  </TabList>
  <TabPanel value="out">Output device and sample rate.</TabPanel>
  <TabPanel value="eq">Ten bands.</TabPanel>
</Tabs>`,
        },
          h('div', { className: 'demo-tabs' },
            h(Tabs, { defaultValue: 'eq' },
              h(TabList, null,
                h(Tab, { value: 'out' }, 'Output'),
                h(Tab, { value: 'eq' }, 'Equaliser'),
                h(Tab, { value: 'list' }, 'Playlist')),
              h(TabPanel, { value: 'out' }, 'Output device and sample rate.'),
              h(TabPanel, { value: 'eq' },
                'The panel and the active trigger share an edge. That fuse is the only thing separating a tab strip from a row of pressed buttons.'),
              h(TabPanel, { value: 'list' }, 'Queue and history.')))),

        h(Section, {
          skin: skinAxis,
          id: 'dialog', title: 'Dialog',
          note: 'Opens with focus inside it, traps Tab, closes on Escape, and returns focus to the trigger. All of that is Radix.',
          code: `import { Dialog, DialogTrigger, DialogPanel, Button }
  from '@josueavalosjim/panelware';

<Dialog>
  <DialogTrigger asChild><Button variant="primary">Preferences</Button></DialogTrigger>
  <DialogPanel title="Preferences">
    <p>Focus is trapped, Escape closes, focus returns to the trigger.</p>
  </DialogPanel>
</Dialog>`,
        },
          h(Dialog, null,
            h(DialogTrigger, { asChild: true },
              h(Button, { variant: 'primary' }, 'Preferences')),
            h(DialogPanel, { title: 'Preferences' },
              h('p', null, 'The title bar is the one place gloss is on by default. It is the Luna titlebar, and it is the single element where the highlight is the point rather than an option.'),
              h('p', null, 'Press Escape, or Tab to the close button. Focus goes back to the trigger either way.')))),

        h(Section, {
          skin: skinAxis,
          id: 'slider', title: 'Slider',
          note: 'Arrow keys, Home and End. Gain announces itself in decibels rather than as a bare number, and Treble does the same without the caller holding any state: format follows the live value whether or not you control it.',
          code: `import { Slider } from '@josueavalosjim/panelware';

const [value, setValue] = useState([40]);

<Slider
  label="Volume"
  value={value}
  onValueChange={setValue}
  max={100}
  // aria-valuenow alone is only adequate for a bare number
  format={(v) => \`\${v - 50} decibels\`}
/>

// Uncontrolled works too, and the announced text still tracks the thumb.
<Slider label="Treble" defaultValue={[60]} max={100}
  format={(v) => \`\${v - 50} decibels\`} />`,
        },
          h('div', { className: 'demo-stack' },
            h('label', { className: 'demo-field' },
              h('span', { className: 'demo-field-label' }, 'Volume'),
              h(Slider, { label: 'Volume', value: volume, onValueChange: setVolume, max: 100 })),
            h('label', { className: 'demo-field' },
              h('span', { className: 'demo-field-label' }, 'Gain'),
              h(Slider, {
                label: 'Gain', value: gain, onValueChange: setGain, max: 100,
                format: (v) => `${v - 50} decibels`,
              })),
            h('label', { className: 'demo-field' },
              h('span', { className: 'demo-field-label' }, 'Treble'),
              h(Slider, {
                label: 'Treble', defaultValue: [60], max: 100,
                format: (v) => `${v - 50} decibels`,
              })),
            h('label', { className: 'demo-field' },
              h('span', { className: 'demo-field-label' }, 'Disabled'),
              h(Slider, { label: 'Balance', defaultValue: [30], max: 100, disabled: true })))),

        h(Section, {
          skin: skinAxis,
          id: 'window', title: 'Window chrome',
          note: 'A title bar, its controls, and the chassis. The dialog uses the same bar: a dialog is a window that happens to be modal. Controls only render when you pass a handler, so nothing here is a dead button.',
          code: `import { Window } from '@josueavalosjim/panelware';

// A control only renders when you pass its handler, so there are no dead
// buttons in a window that cannot be minimised.
<Window title="Playlist" onMinimize={min} onMaximize={max} onClose={close}>
  <p>Body content.</p>
</Window>`,
        },
          h('div', { className: 'demo-stack' },
          h(Window, {
            title: 'Playlist',
            onMinimize: () => {}, onMaximize: () => {}, onClose: () => {},
          },
            h('p', { style: { margin: 0 } },
              'The title bar does not pretend to drag. There is no window to move, and a handle that looks draggable and is not is the same failure as a button that looks pressable and is not.')))),

        h(Section, {
          skin: skinAxis,
          id: 'transport', title: 'Transport and seek',
          note: 'A Radix Toolbar, so Tab enters the cluster once and the arrow keys move inside it. Icon-only is the one exception the kit allows, and it is paid for: every button requires a label and it becomes the accessible name.',
          code: `import { Transport, TransportButton, Progress }
  from '@josueavalosjim/panelware';

// A Radix Toolbar: one tab stop, arrow keys inside.
<Transport label="Playback">
  <TransportButton icon="previous" label="Previous track" />
  <TransportButton icon="play" label="Play" onClick={play} />
  <TransportButton icon="stop" label="Stop" onClick={stop} />
</Transport>

<Progress value={28} max={210} label="Buffered" />`,
        },
          h('div', { className: 'demo-stack' },
            h(Transport, { label: 'Playback' },
              h(TransportButton, { icon: 'previous', label: 'Previous track' }),
              h(TransportButton, {
                icon: playing ? 'pause' : 'play',
                label: playing ? 'Pause' : 'Play',
                onClick: () => setPlaying((p) => !p),
              }),
              h(TransportButton, { icon: 'stop', label: 'Stop', onClick: () => setPlaying(false) }),
              h(TransportButton, { icon: 'next', label: 'Next track' }),
              h(TransportButton, { icon: 'eject', label: 'Eject' })),
            h('label', { className: 'demo-field' },
              h('span', { className: 'demo-field-label' }, 'Seek'),
              h(Slider, {
                label: 'Position', value: position, onValueChange: setPosition, max: 210,
                format: (v) => `${Math.floor(v / 60)} minutes ${v % 60} seconds`,
              })),
            h('label', { className: 'demo-field' },
              h('span', { className: 'demo-field-label' }, 'Buffered'),
              h(Progress, {
                value: position[0] + 30, max: 210, label: 'Buffered',
                format: (v, m) => `${Math.round((v / m) * 100)} percent buffered`,
              })))),

        h(Section, {
          skin: skinAxis,
          id: 'list', title: 'Playlist',
          note: 'A listbox. Click a row or arrow through it; Enter or a double click plays. Selected and playing are separate states, because you scroll a selection past the playing track constantly. The playing row carries a mark and a weight, not only a colour: Winamp colour-codes its rows and that is the one thing here not taken from it.',
          code: `import { List } from '@josueavalosjim/panelware';

// selected and current are different states, and a row can hold both
<List
  label="Playlist"
  rows={tracks}                       // { id, primary, secondary }[]
  selected={picked}
  onSelect={setPicked}
  onActivate={setNowPlaying}
  current={nowPlaying}
/>`,
        },
          h('div', { className: 'demo-stack' },
            h(List, {
              label: 'Playlist',
              rows: tracks,
              selected: picked,
              onSelect: setPicked,
              onActivate: setNowPlaying,
              current: nowPlaying,
            }))),

        h(Section, {
          skin: skinAxis,
          id: 'menubar', title: 'Menu bar',
          note: 'Radix Menubar, so the bar is one tab stop and the arrow keys do the rest: between triggers, into a menu, through its items, into a submenu. Escape closes. Type a letter to jump. The bar itself is flat and a trigger inverts when its menu is open, which is what separates "this menu is showing" from "this button is pressed".',
          code: `import { Menubar, Menu, MenuTrigger, MenuContent, MenuItem,
  MenuCheckboxItem, MenuSeparator, MenuSub } from '@josueavalosjim/panelware';

<Menubar>
  <Menu value="file">
    <MenuTrigger>File</MenuTrigger>
    <MenuContent>
      <MenuItem shortcut="Ctrl+L">Open file</MenuItem>
      <MenuSeparator />
      <MenuSub label="Open recent"><MenuItem>Echo</MenuItem></MenuSub>
    </MenuContent>
  </Menu>
</Menubar>`,
        },
          h('div', { className: 'demo-stack' },
            h(Menubar, null,
              h(Menu, { value: 'file' },
                h(MenuTrigger, null, 'File'),
                h(MenuContent, null,
                  h(MenuItem, { shortcut: 'Ctrl+L' }, 'Open file'),
                  h(MenuItem, { shortcut: 'Ctrl+D' }, 'Open directory'),
                  h(MenuSeparator, null),
                  h(MenuSub, { label: 'Open recent' },
                    h(MenuItem, null, 'Llama Whippin Intro'),
                    h(MenuItem, null, 'Echo'),
                    h(MenuItem, null, 'Midnight City')),
                  h(MenuSeparator, null),
                  h(MenuItem, { shortcut: 'Alt+F4' }, 'Exit'))),
              h(Menu, { value: 'play' },
                h(MenuTrigger, null, 'Play'),
                h(MenuContent, null,
                  h(MenuItem, { shortcut: 'X' }, 'Play'),
                  h(MenuItem, { shortcut: 'C' }, 'Pause'),
                  h(MenuItem, { shortcut: 'V' }, 'Stop'),
                  h(MenuSeparator, null),
                  h(MenuItem, { disabled: true }, 'Jump to time'))),
              h(Menu, { value: 'options' },
                h(MenuTrigger, null, 'Options'),
                h(MenuContent, null,
                  h(MenuCheckboxItem, {
                    checked: alwaysOnTop, onCheckedChange: setAlwaysOnTop, shortcut: 'Ctrl+A',
                  }, 'Always on top'),
                  h(MenuCheckboxItem, {
                    checked: doubleSize, onCheckedChange: setDoubleSize, shortcut: 'Ctrl+D',
                  }, 'Double size'),
                  h(MenuSeparator, null),
                  h(MenuLabel, null, 'Skin'),
                  h(MenuRadioGroup, { value: skin, onValueChange: setSkin },
                    h(MenuRadioItem, { value: 'base' }, 'Base'),
                    h(MenuRadioItem, { value: 'night' }, 'Night')))),
              h(Menu, { value: 'help' },
                h(MenuTrigger, null, 'Help'),
                h(MenuContent, null,
                  h(MenuItem, { shortcut: 'F1' }, 'Contents'),
                  h(MenuItem, null, 'About panelware')))))),

        h(Section, {
          skin: skinAxis,
          id: 'equalizer', title: 'Equaliser',
          note: 'Ten independent bands, not a multi-thumb slider. A multi-thumb slider is a range and re-sorts its thumbs, so driving one band would silently renumber it into another. Each band keeps its own name and value. Gain is announced in decibels, because a bare signed number is not something you can hear the sign of.',
          code: `import { Equalizer } from '@josueavalosjim/panelware';

// Independent bands, not a multi-thumb slider: a multi-thumb slider is a
// range and re-sorts its thumbs, which would renumber a band mid-drag.
<Equalizer
  label="Equaliser"
  min={-12}
  max={12}
  bands={bands}                       // { id, label, name, value }[]
  onBandChange={(id, value) => set(id, value)}
  format={(v, band) => \`\${band.name}, \${v} decibels\`}
/>`,
        },
          h(Equalizer, {
            label: 'Equaliser',
            bands: eq,
            min: -12, max: 12,
            onBandChange: (id, value) =>
              setEq((prev) => prev.map((b) => (b.id === id ? { ...b, value } : b))),
            format: (v, band) =>
              `${band.name}, ${v > 0 ? 'plus ' : v < 0 ? 'minus ' : ''}${Math.abs(v)} decibels`,
          })),

        h(Section, {
          skin: skinAxis,
          id: 'badge', title: 'Status badge',
          note: 'A glyph and a word, every time. There is no prop that reduces one to a coloured dot.',
          code: `import { Badge } from '@josueavalosjim/panelware';

// Every badge renders a mark AND a word. There is no prop that reduces one
// to a coloured dot.
<Badge status="success">Connected</Badge>
<Badge status="warning">Buffering</Badge>
<Badge status="error">No device</Badge>`,
        },
          h(Badge, { status: 'success' }, 'Connected'),
          h(Badge, { status: 'warning' }, 'Buffering'),
          h(Badge, { status: 'error' }, 'No device'),
          h(Badge, null, 'Idle')),

        h(Section, {
          skin: skinAxis,
          id: 'spinner', title: 'Spinner',
          note: 'Eight cells on the sheet, stepped. Not one glyph rotated: only a quarter turn is exact on a pixel grid, so the other seven positions are drawn. Under reduced motion it slows rather than stops, because a stopped spinner reads as a hung process.',
          code: `import { Spinner } from '@josueavalosjim/panelware';

// The label is announced when it appears. Say what is loading, if you know.
<Spinner />
<Spinner label="Loading playlist" />`,
        },
          h(Spinner, null),
          h(Spinner, { label: 'Loading playlist' })),

        h(Section, {
          skin: skinAxis,
          id: 'tokens', title: 'Tokens',
          note: 'The whole contract, generated from the same files the gate reads, so this table cannot drift from the build. A value shown as a colour is the literal a var() chain lands on; the declared value is usually another token.',
        }, docs ? h(TokenTable, { groups: docs.groups }) : h('p', { className: 'demo-note' }, 'loading')),

        h(Section, {
          skin: skinAxis,
          id: 'contrast', title: 'Measured contrast',
          note: 'Every pair the gate checks, with the ratio it actually measured rather than the one the palette was designed for. These run on every build and the build fails if one drops under its floor. No other kit publishes this, and the only work was writing down numbers we already compute.',
        }, docs ? h(ContrastTable, { rows: docs.contrast }) : h('p', { className: 'demo-note' }, 'loading')),

        h(Section, {
          skin: skinAxis,
          id: 'lcd', title: 'Readout',
          note: 'An image of text, so it carries its string as a name rather than as a live region. The marquee has a real pause button, because pausing on hover is not a mechanism a keyboard user has.',
          code: `import { Readout } from '@josueavalosjim/panelware';

<Readout value="04:21" />
<Readout value="PANELWARE" mode="glyphs" />

// A marquee ships a real pause control, because pausing on hover is not a
// mechanism a keyboard or touch user has.
<Readout value="NOW PLAYING - " mode="glyphs" marquee />`,
        },
          h('div', { className: 'demo-stack' },
            h(Readout, { value: String(volume[0]).padStart(2, '0') + ':' + String(gain[0]).padStart(2, '0') }),
            h(Readout, { value: '-12.5' }),
            h(Readout, { value: 'PANELWARE', mode: 'glyphs' }),
            h(Readout, { value: 'NOW PLAYING - PANELWARE 0.1.0 - ', mode: 'glyphs', marquee: true }))));
    }

    createRoot(document.getElementById('root')).render(h(StrictMode, null, h(App)));
  </script>
</body>
</html>
