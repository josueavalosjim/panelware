name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      # The contract: both themes declare the same token set, theme-auto has
      # not drifted from the dark block, no bevel offset is a literal, and the
      # committed sheets are what the font data draws.
      - run: npm test

      # Contrast from the declared tokens, plus the one-off value and unknown
      # token checks. Reads files, needs nothing running, half a second.
      - name: the palette still clears its floors
        run: npm run check

      # A gate nobody has watched fail is a gate nobody should believe. The
      # fixture checks the bevel highlight against the 3:1 an edge would need,
      # which it misses at 1.47:1 by design, so this is also where the
      # exemption is recorded in a form the build would notice being deleted.
      - name: the gate still fires
        run: |
          if npx taste-check --config test/fixture/fail.tastecheck.json; then
            echo "the failing fixture passed, so the contrast check is not checking"
            exit 1
          fi

      # A missing Chromium must not read as a clean run. scripts/runtime.mjs
      # exits non-zero rather than skipping, so this needs no separate guard.
      - name: contrast measured off the rendered page, in both themes
        run: npm run check:runtime

      # The three checks that need the pages rather than the files. They serve
      # demo/ themselves on an ephemeral port, because demo/index.html boots
      # React through an import map and ES modules do not load over file://:
      # it came up with an empty <main>, and the first version of the overflow
      # check reported clean at every width having measured nothing. Each one
      # counts the controls it found before trusting a green result.
      #
      # index.html pulls React and Radix from esm.sh, so these need a network.
      # That is the same bet the demo page itself makes.
      - name: nothing scrolls sideways, 320 up
        run: npm run check:overflow

      # The static page is only proof of anything while it renders the same
      # shapes as the live one.
      - name: the two demo pages still agree
        run: npm run check:parity

      # Every colour actually painted, against the ground it actually lands
      # on, rather than the twenty pairs somebody thought to configure.
      - name: every painted pair clears its floor
        run: npm run check:colour

      # Every class the kit renders has to match a rule the browser kept. One
      # extra } closed a layer early in 0.1.0 and orphaned every rule after
      # it: eleven rules reached the CSSOM instead of 289, and nothing else
      # here could see it, because the text was in the file and both demo
      # pages were broken identically so they still agreed with each other.
      - name: the browser kept the stylesheet
        run: npm run check:cssom

      # axe over every component in every state, both themes. The kit measured
      # contrast exhaustively and accessibility not at all until this: the ARIA
      # coverage was seventeen string assertions, which check that a component
      # emits an attribute and cannot check whether the result is usable. It
      # found role="img" wrapped around the marquee's pause button on its first
      # run, which made a focusable control invisible to a screen reader.
      #
      # Colour rules are off. taste-check already measures contrast against the
      # ground each token lands on, which is the stricter question.
      - name: axe finds nothing
        run: npm run check:a11y
