name: publish

# Tag a version and it ships. No npm token lives here: publishing runs over
# OIDC against a trusted publisher configured on npmjs.com, so there is no
# long-lived credential to leak and no 2FA prompt to answer.
on:
  push:
    tags: ['v*']

jobs:
  # The whole gate, not a shorter copy of it. This job used to run npm test
  # and the palette check and nothing else, so overflow, parity, colour, CSSOM
  # and axe gated main and pull requests only, and a tag push could ship with
  # a red axe run. Calling test.yml rather than restating its steps is the
  # point: a second list is a list that drifts, and the thing that drifted off
  # the first one was every check that needs a browser.
  #
  # It runs the node matrix, so a tag builds twice. That is the intended cost
  # of the release gate being the same gate, rather than one that resembles it.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC. Without it, npm falls back to a token.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with package.json publishes a version nobody can
      # trace back to a commit. npm retires a version number permanently, so
      # this has to be caught before the publish, not after.
      - name: tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg"
            exit 1
          fi

      # Re-running a workflow, or tagging a version that already shipped,
      # should be a no-op rather than a red run.
      #
      # prepublishOnly regenerates the bundles here, after everything above.
      # That used to mean the tarball's generated bytes were the one artifact
      # nothing had verified, which is structurally how 0.1.0 shipped broken.
      # The checks job now builds first and asserts the committed files are
      # byte-identical to what the generators produce, so this rebuild is a
      # no-op that has been proved to be one.
      - name: publish unless this version is already on the registry
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already published, nothing to do"
            exit 0
          fi
          npm publish
